name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: App bauen
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CitroenAnzeige-ipa
          path: CitroenAnzeige.ipa
          retention-days: 30
