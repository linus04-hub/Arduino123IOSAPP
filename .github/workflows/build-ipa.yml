# Baut CitroenAnzeige.ipa auf einem Mac-Server von GitHub.
# Auf dem Hauptzweig wird zusaetzlich ein Release mit der .ipa und der
# AltStore-Quelle veroeffentlicht. AltStore-Quelle (einmal hinzufuegen):
#   https://github.com/linus04-hub/Arduino123IOSAPP/releases/latest/download/altstore-source.json
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 123-Parser pruefen
        run: |
          mkdir -p "$RUNNER_TEMP/t123"
          cat Sources/Tune123.swift Tests/Tune123Check.swift > "$RUNNER_TEMP/t123/main.swift"
          swiftc -swift-version 5 "$RUNNER_TEMP/t123/main.swift" -o "$RUNNER_TEMP/t123/check"
          "$RUNNER_TEMP/t123/check"

      - name: App bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CitroenAnzeige-ipa
          path: CitroenAnzeige.ipa
          retention-days: 30

      - name: Release und AltStore-Quelle veroeffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=build/Release-iphoneos/CitroenAnzeige.app
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          TAG="v${VERSION}-${{ github.run_number }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/CitroenAnzeige.ipa"
          python3 .github/scripts/altstore_source.py "$APP" CitroenAnzeige.ipa "$URL" altstore-source.json
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" CitroenAnzeige.ipa altstore-source.json \
            --title "Citroën ${VERSION} (Build ${{ github.run_number }})" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
