# XcodeGen-Projektbeschreibung — erzeugt CitroenAnzeige.xcodeproj
# (build_ipa.sh ruft das automatisch auf)
name: CitroenAnzeige
options:
  bundleIdPrefix: de.linus
  deploymentTarget:
    iOS: "16.1"          # Live-Aktivitaeten gibt es ab iOS 16.1
    macOS: "14.0"        # Mac-App "Citroën Analyse"
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
targets:
  CitroenAnzeige:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - target: CitroenWidgets
    scheme:
      testTargets:
        - CitroenAnzeigeUITests       # nur fuer Bildschirmfotos (Workflow "Screenshots")
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Citroën
        CFBundleShortVersionString: "$(MARKETING_VERSION)"   # sonst steht immer 1.0 (1) drin
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Verbindet sich mit der Anzeige im Auto und der 123ignition, um Lambda, Öl, Tank, Drehzahl und Zündwinkel anzuzeigen.
        NSLocationWhenInUseUsageDescription: Für Tempo und Strecke im Fahrtenschreiber.
        NSLocationAlwaysAndWhenInUseUsageDescription: Damit Tempo und Strecke auch bei gesperrtem Bildschirm aufgezeichnet werden.
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true               # Fahrten in der Dateien-App sichtbar
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true   # 120 Hz auf ProMotion-iPhones
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linus.citroenanzeige
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 34KNQH7F76      # Linus (Personal Team), dann ist das Team in Xcode schon gewaehlt

  CitroenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: CitroenWidgets-Info.plist     # ausserhalb des Quellordners
      properties:
        CFBundleDisplayName: Citroën
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linus.citroenanzeige.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 34KNQH7F76      # Linus (Personal Team), dann ist das Team in Xcode schon gewaehlt
        SKIP_INSTALL: YES

  CitroenAnzeigeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CitroenAnzeige
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linus.citroenanzeige.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 34KNQH7F76      # Linus (Personal Team), dann ist das Team in Xcode schon gewaehlt

  # Auswertung am Mac. Liest die Daten der iPhone-App, nur lesend.
  # Ad-hoc signiert ("-"), braucht kein Apple-Konto und laeuft unbegrenzt.
  CitroenMac:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Mac
      - path: MacResources
      - path: Sources/Samples.swift
      - path: Sources/Mixture.swift
      - path: Sources/TuningSession.swift
      - path: Sources/MixtureDiagnosis.swift
      - path: Sources/TipInDetector.swift
      - path: Sources/PullDetector.swift
      - path: Sources/AlertMonitor.swift
      - path: Sources/CarbSetup.swift
      - path: Sources/TripModel.swift
      - path: Sources/MapData.swift
    info:
      path: CitroenMac-Info.plist
      properties:
        CFBundleDisplayName: Citroën Analyse
        CFBundleName: Citroën Analyse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: Linus Beeck
    settings:
      base:
        PRODUCT_NAME: CitroenAnalyse
        PRODUCT_BUNDLE_IDENTIFIER: de.linus.citroenanzeige.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
